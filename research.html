<section class="sp-hero" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px var(--s-section); display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: flex-end">
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: var(--s-head)"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">Research</p><h1 class="rise d1" style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(48px, 6.4vw, 92px); line-height: 0.9; letter-spacing: 0.01em; text-wrap: balance">Built on 15+ years<br><span style="color: #04C1E2">of research.</span></h1><p class="rise d2" style="font-size: 20px; color: #C9D6E2; max-width: 680px; text-wrap: pretty">BRAVR doesn’t guess. The method comes from published work on stress-inducing VR, live biometrics, heart-rate variability and game-based biofeedback.</p></div>
</section>
<section class="tx tx-hiw" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div style="display: flex; flex-direction: column; gap: var(--s-head); max-width: 820px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">How it works</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">A real stress response, <br><span style="color: rgb(4, 193, 226)">safely.</span></h2><p class="" style="font-size: 20px; color: #C9D6E2; max-width: 700px; text-wrap: pretty">We use a VR environment to safely trigger a real stress response, then help you learn to control it.</p></div><div class="steps4"><div><span class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path><path d="M5 12h3l2-3 3 6 2-3h4"></path></svg></span><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">01 · Monitor</p><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">During play, we monitor each player’s heart-rate variability (HRV), a measure of the body’s response to acute stress.</p></div><div><span class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="5"></rect><path d="M8 11v3M6.5 12.5h3"></path><circle cx="15.5" cy="11.5" r="1"></circle><circle cx="17.5" cy="13.5" r="1"></circle></svg></span><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">02 · Restrict</p><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">As players get more stressed, sound and vision are restricted, making it harder to complete challenges.</p></div><div><span class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2 2M14 9l2 2"></path></svg></span><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">03 · Assess</p><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">These challenges show how well players stay in control while under pressure.</p></div><div><span class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg></span><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">04 · Train</p><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">The calmer players stay, the easier it is to succeed. That feedback loop trains the nervous system’s response to danger, so performance holds when it matters most.</p></div></div>
</div>
</section>
<section class="tx tx-data" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div style="display: flex; flex-wrap: wrap; gap: var(--s-head) var(--s-col); align-items: flex-end; justify-content: space-between"><div style="display: flex; flex-direction: column; gap: var(--s-head); max-width: 760px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">Supporting research</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">The studies<br><span style="color: rgb(4, 193, 226)">WE're Built on.</span></h2></div><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">14 papers · links open the original publication</p></div><div><div class="rs-group"><div style="display: flex; flex-direction: column; gap: 8px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1">VR stimulation in stress exposure and inoculation</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">5 papers</p></div><ul class="rs-list"><li><a href="https://www.researchgate.net/publication/44654140_Physiology-Driven_Adaptive_Virtual_Reality_Stimulation_for_Prevention_and_Treatment_of_Stress_Related_Disorders" target="_blank" rel="noopener"><span class="rs-t">Physiology-Driven Adaptive Virtual Reality Stimulation for Prevention and Treatment of Stress Related Disorders</span><span class="rs-s">ResearchGate ↗</span></a></li><li><a href="https://www.researchgate.net/publication/289316755_Virtual_reality_adaptive_stimulation_of_limbic_networks_in_the_mental_readiness_training" target="_blank" rel="noopener"><span class="rs-t">Virtual reality adaptive stimulation of limbic networks in the mental readiness training</span><span class="rs-s">ResearchGate ↗</span></a></li><li><a href="https://www.researchgate.net/publication/26661667_Stress_inoculation_training_supported_by_physiology-driven_adaptive_virtual_reality_stimulation" target="_blank" rel="noopener"><span class="rs-t">Stress inoculation training supported by physiology-driven adaptive virtual reality stimulation</span><span class="rs-s">ResearchGate ↗</span></a></li><li><a href="https://www.sciencedirect.com/science/article/abs/pii/S0149763422001981" target="_blank" rel="noopener"><span class="rs-t">Evoking stress reactivity in virtual reality: A systematic review and meta-analysis</span><span class="rs-s">ScienceDirect ↗</span></a></li><li><a href="https://asma.kglmeridian.com/view/journals/amhp/87/12/article-p1021.xml" target="_blank" rel="noopener"><span class="rs-t">Virtual Reality Applications for Stress Management Training in the Military</span><span class="rs-s">Aerospace Medicine and Human Performance ↗</span></a></li></ul></div><div class="rs-group"><div style="display: flex; flex-direction: column; gap: 8px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1">Real-time biometrics for stress management</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">4 papers</p></div><ul class="rs-list"><li><a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2021.586553/full" target="_blank" rel="noopener"><span class="rs-t">Breathing Biofeedback for Police Officers in a Stressful Virtual Environment: Challenges and Opportunities</span><span class="rs-s">Frontiers in Psychology ↗</span></a></li><li><a href="https://onlinelibrary.wiley.com/doi/10.1155/2013/747694" target="_blank" rel="noopener"><span class="rs-t">A Systematic Review of Biopsychosocial Training Programs for the Self-Management of Emotional Stress: Potential Applications for the Military</span><span class="rs-s">Wiley ↗</span></a></li><li><a href="https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0245068" target="_blank" rel="noopener"><span class="rs-t">Development of a modular stress management platform (Performance Edge VR) and a pilot efficacy trial of a bio-feedback enhanced training module for controlled breathing</span><span class="rs-s">PLOS ONE ↗</span></a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10659241/" target="_blank" rel="noopener"><span class="rs-t">Evaluation of a Virtual Reality Platform to Train Stress Management Skills for a Defense Workforce: Multisite, Mixed Methods Feasibility Study</span><span class="rs-s">PubMed Central ↗</span></a></li></ul></div><div class="rs-group"><div style="display: flex; flex-direction: column; gap: 8px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1">HRV as a measure of stress-response training</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">2 papers</p></div><ul class="rs-list"><li><a href="https://www.nature.com/articles/s41598-019-44201-7" target="_blank" rel="noopener"><span class="rs-t">Voluntary upregulation of heart rate variability through biofeedback is improved by mental contemplative training</span><span class="rs-s">Scientific Reports ↗</span></a></li><li><a href="https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2019.00466/full" target="_blank" rel="noopener"><span class="rs-t">Cognitive Fitness Framework: Towards Assessing, Training and Augmenting Individual-Difference Factors Underpinning High-Performance Cognition</span><span class="rs-s">Frontiers in Human Neuroscience ↗</span></a></li></ul></div><div class="rs-group"><div style="display: flex; flex-direction: column; gap: 8px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1">Game-driven biofeedback training</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">1 paper</p></div><ul class="rs-list"><li><a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2022.806163/full" target="_blank" rel="noopener"><span class="rs-t">Deep-Breathing Biofeedback Trainability in a Virtual-Reality Action Game: A Single-Case Design Study With Police Trainers</span><span class="rs-s">Frontiers in Psychology ↗</span></a></li></ul></div><div class="rs-group"><div style="display: flex; flex-direction: column; gap: 8px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1">Immersion in design</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">2 papers</p></div><ul class="rs-list"><li><a href="https://www.tandfonline.com/doi/full/10.1080/1047840X.2019.1693872" target="_blank" rel="noopener"><span class="rs-t">Reducing the Noise of Reality</span><span class="rs-s">Taylor &amp; Francis ↗</span></a></li><li><a href="https://www.researchgate.net/publication/298421915_The_stress_and_workload_of_virtual_reality_training_the_effects_of_presence_immersion_and_flow" target="_blank" rel="noopener"><span class="rs-t">The stress and workload of virtual reality training: the effects of presence, immersion and flow</span><span class="rs-s">ResearchGate ↗</span></a></li></ul></div></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: center"><div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">From the field</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">Tested where<br><span data-i18n="research-pressure" style="color: rgb(4, 193, 226)">Pressure is the job.</span></h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">In 2026 we ran a pilot with UK police firearms officers. Each workout produces a BioScore report that shows where the stress response faltered and how fast it recovered.</p><div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="index.html#book" style="background: #04C1E2; color: #03111E; border: 1px solid #04C1E2; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Try it in Amsterdam</a><a href="contact.html" style="background: transparent; color: #F6FBFF; border: 1px solid #23415E; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Ask about a pilot</a></div></div><figure style="flex: 1 1 440px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 10px"><img src="assets/img/graph-2.png" alt="A workout report showing the BioScore line over four rounds" style="width: 100%; border-radius: 16px; background: #fff; display: block"><figcaption style="font-size: 14px; color: #A9BCCD">BioScore, UK police pilot 2026, participant workout report</figcaption></figure></div
