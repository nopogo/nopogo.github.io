<div style="display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: flex-start"><nav class="toc" aria-label="On this page" style="flex: 0 1 240px"><a href="#who">Who we are</a><a href="#collect">What we collect</a><a href="#use">How we use it</a><a href="#share">Who we share it with</a><a href="#cookies">Advertising and cookies</a><a href="#protect">How we protect it</a><a href="#rights">Your rights</a><a href="#changes">Changes to this policy</a></nav><div class="legal" style="flex: 1 1 520px; min-width: 0"><section id="who"><h2>Who we are</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">BRAVR Technologies BV (“BRAVR”, “we”) is responsible for the personal data described here. We are registered with the Dutch Chamber of Commerce (KvK) under number 97265896. You can reach us at <a href="mailto:build@bravr.io">build@bravr.io</a>.</p><p style="font-size: 17px; line-height: 1.6; color: #A9BCCD">[Placeholder: registered address.]</p></section><section id="collect"><h2>What we collect</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">We only collect what you give us:</p><ul><li><strong>Updates and early access:</strong> your name, email address and, if you give them, your job title and organisation.</li><li><strong>Pilot booking:</strong> name, email, phone (optional), where you train, any member or community code, your chosen sessions, and your answers to the health check and the medication question.</li><li><strong>Training sessions:</strong> heart rate and heart-rate variability, recorded under a username rather than your name. We record this only with your consent.</li><li><strong>Contact form:</strong> your name, email, organisation (optional) and your message.</li></ul><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">We do not collect sensitive data such as political views, racial or ethnic origin or religious beliefs, and we never use health data for advertising.</p></section><section id="use"><h2>How we use it</h2><ul><li>To contact you about the products, services or pilots you asked about.</li><li>To manage your pilot booking and run your training sessions.</li><li>To show you your own training results.</li><li>To improve BRAVR, using anonymised group results only.</li><li>To understand which job roles our website and campaigns reach.</li></ul><p style="font-size: 17px; line-height: 1.6; color: #A9BCCD">[Placeholder: legal basis for each use (consent, contract, legitimate interest).]</p></section><section id="share"><h2>Who we share it with</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">We never sell your personal data. We use a small number of services to run BRAVR:</p><ul><li><strong>Stripe</strong> processes deposit payments. We never see your card or bank details.</li><li><strong>Google</strong> (Sheets and Apps Script) stores booking and contact-form details.</li><li><strong>LinkedIn</strong> runs our advertising (see below).</li></ul></section><section id="cookies"><h2>Advertising and cookies</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">Our LinkedIn ads target broad audiences that meet LinkedIn’s minimum audience size. We do not micro-target individuals.</p><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">Cookies and similar technologies may be used to measure how our ads perform on third-party sites and apps such as LinkedIn. You can manage cookie and ad settings in your browser or your LinkedIn account.</p><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">This website itself stores two small settings in your browser: your language choice, and your booking details for up to three days after you pay, so we can show your confirmation.</p></section><section id="protect"><h2>How we protect it</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">We store personal data securely using standard safeguards. Training data is kept under a username; the link between your name and username is kept separately in an encrypted file and deleted once the pilot’s final follow-up survey closes.</p><p style="font-size: 17px; line-height: 1.6; color: #A9BCCD">[Placeholder: how long other data is kept.]</p></section><section id="rights"><h2>Your rights</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">You can ask us at any time to see, correct or delete your personal data. Email <a href="mailto:build@bravr.io">build@bravr.io</a> and we will respond within one month.</p><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">You can also withdraw your consent at any time, object to how we use your data, or complain to the Dutch Data Protection Authority (Autoriteit Persoonsgegevens).</p></section><section id="changes"><h2>Changes to this policy</h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">If we change this policy, we will update this page and the date at the top.</p></section></div></div>
