<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: var(--s-head)"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">About BRAVR</p><h1 class="rise d1" style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(48px, 6.4vw, 92px); line-height: 0.9; letter-spacing: 0.01em; text-wrap: balance">Master your<br><span style="color: #04C1E2">instincts.</span></h1><p class="rise d2" style="font-size: 20px; color: #C9D6E2; max-width: 680px; text-wrap: pretty">BRAVR Technologies is a Dutch VR startup. We combine virtual reality with live heart data to train people to stay in control when stress spikes: first soldiers and emergency responders, now anyone who performs under pressure.</p></div>
</section>
<section class="tx tx-hiw" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div style="display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: center"><div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">Our story</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">Pressure is the job. <span style="color: #04C1E2">Panic shouldn’t be.</span></h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">An uncontrolled stress response hurts performance, and in some jobs it costs lives. Over years, it also wears people down: exhaustion, burnout, PTSD.</p><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">Stress exposure training works, but it is expensive, hard to organise and judged by eye. We started BRAVR to make it something you can do anywhere, measure properly and repeat until it sticks.</p><p style="font-size: 17px; line-height: 1.6; color: #A9BCCD">[Placeholder: founding moment. When and why the founders started BRAVR, in two or three sentences.]</p></div><div class="photo-grid" style="flex: 1 1 440px; min-width: 0"><img src="assets/img/police-pilot-2.jpg" alt="An officer training in a BRAVR headset while colleagues watch. Faces are blurred."><img src="assets/img/step-headset.jpg" alt="A woman in a VR headset holding both controllers"><img src="assets/img/step-strap.jpg" alt="A heart-rate chest strap being fitted under a sweater"></div></div>
</div>
</section>
<section class="tx tx-data" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div style="display: flex; flex-direction: column; gap: var(--s-head); max-width: 760px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">Our approach</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">Stress training,<br><span style="color: rgb(4, 193, 226)">fixed.</span></h2><p class="" style="font-size: 20px; color: #C9D6E2; max-width: 700px; text-wrap: pretty">Traditional stress exposure and inoculation training (SET/SIT) has three problems. BRAVR is built to solve each one.</p></div><div class="vms" style="grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr))"><div style="min-height: 0; background: #0A1C2C; justify-content: flex-start"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Today: expensive</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 34px; line-height: 0.95">Affordable</p><p style="font-size: 16px; line-height: 1.6; color: #A9BCCD">High per-person and logistics costs keep it rare. One BRAVR box trains a whole team.</p></div><div style="min-height: 0; background: #0A1C2C; justify-content: flex-start"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Today: inaccessible</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 34px; line-height: 0.95">Anywhere</p><p style="font-size: 16px; line-height: 1.6; color: #A9BCCD">Venues, travel and scheduling limit it to specialist units. BRAVR needs a 2 × 2 m space and a plug.</p></div><div style="min-height: 0; background: #0A1C2C; justify-content: flex-start"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Today: imprecise</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 34px; line-height: 0.95">Measured</p><p style="font-size: 16px; line-height: 1.6; color: #A9BCCD">Progress is judged by observation. BRAVR reads your heart-rate variability, second by second.</p></div></div><div style="display: flex; flex-direction: column; gap: 14px"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Recognised by</p><div style="display: flex; flex-wrap: wrap; gap: 12px"><span style="border: 1px solid #23415E; border-radius: 999px; padding: 10px 18px; font-size: 15px; color: #C9D6E2">F6S · Top wellness startup NL</span><span style="border: 1px solid #23415E; border-radius: 999px; padding: 10px 18px; font-size: 15px; color: #C9D6E2">EU-Startups</span><span style="border: 1px solid #23415E; border-radius: 999px; padding: 10px 18px; font-size: 15px; color: #C9D6E2">Silicon Canals</span><span style="border: 1px solid #23415E; border-radius: 999px; padding: 10px 18px; font-size: 15px; color: #C9D6E2">UK police pilot 2026</span><span style="border: 1px solid #23415E; border-radius: 999px; padding: 10px 18px; font-size: 15px; color: #C9D6E2">[PARTNER LOGO]</span><span style="border: 1px solid #23415E; border-radius: 999px; padding: 10px 18px; font-size: 15px; color: #C9D6E2">[PARTNER LOGO]</span></div></div>

<section class="tx" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px; overflow: hidden"><img src="assets/img/graph-2.png" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(18px) saturate(.6); opacity: .22; z-index: -2; transform: scale(1.1)"><div style="position: absolute; inset: 0; z-index: -1; background: linear-gradient(to right, rgba(3,17,30,.97) 30%, rgba(3,17,30,.75))"></div><div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: center"><div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">Built on research</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">15+ years of science<span style="color: rgb(4, 193, 226)">.</span></h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">BRAVR applies principles from more than fifteen years of academic research into stress-inducing VR, real-time biometrics, heart-rate variability and game-driven biofeedback.</p><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">Every workout is designed to trigger a real stress response safely, measure it live, and teach your body to settle faster each time.</p><div><a href="research.html" style="background: #04C1E2; color: #03111E; border: 1px solid #04C1E2; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">See the research</a></div></div><div style="flex: 1 1 280px; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px"><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">15+</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">years of research behind the method</p></div><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">14</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">peer-reviewed studies we build on</p></div><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">€130k</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">pre-seed raised, August 2025</p></div><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">2026</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">first police pilot, UK</p></div></div></div></section>
