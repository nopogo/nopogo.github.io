<section class="sp-hero" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px var(--s-section); display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: flex-end">
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: var(--s-head)"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">THE NEXT STEP TO</p><h1 class="rise d1" style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(48px, 6.4vw, 92px); line-height: 0.9; letter-spacing: 0.01em; text-wrap: balance">Master your<br><span style="color: #04C1E2">instincts.</span></h1><p class="rise d2" style="font-size: 20px; color: #C9D6E2; max-width: 680px; text-wrap: pretty">For high performers who others count on under pressure, BRAVR trains your stress response so you stay clear-headed when it matters. Unlike meditation apps, you practice under realistic pressure while seeing your body respond live.</p></div>
</section>
<section class="tx tx-hiw" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div class="story"><div style="display: flex; flex-direction: column; gap: var(--s-head)"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">ABOUT</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">Our STORY<span style="color: #04C1E2">.</span></h2></div><p class="st-lead">We’ve all seen what pressure can do. It clouds judgment, disrupts focus, and gets in the way of performing at your best. Over time, it takes a toll on your body and mind.</p><div><figure class="st-note"><img src="assets/img/welkom-thuis.jpg" alt="A child’s drawing that says Welkom thuis papa: welcome home, dad"><figcaption>“Welkom thuis papa”: welcome home, dad.</figcaption></figure><p>As parents of young children we realised being at your best when you are at your worst is a skill, not a personality trait. And like any skill, it can be trained.</p></div><p class="st-quote" style="clear: both">A skill, <span style="color: #04C1E2">not a personality trait.</span></p><p>We started BRAVR to make training that skill something you can do anywhere, measure properly and repeat until it sticks.</p><figure class="st-wide"><img src="assets/img/founders-box.jpg" alt="The three BRAVR founders smiling behind a BRAVR box" style="object-position: center 30%"><img src="assets/img/microlab-field-test.jpg" alt="A tester wearing a VR headset during a BRAVR field test at an office in Rotterdam" style="object-position: center 22%"><figcaption>The founders with the first BRAVR box, and a field test at the MicroLab in Rotterdam.</figcaption></figure></div>
</div>
</section>

<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div style="display: flex; flex-direction: column; gap: var(--s-head); max-width: 760px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">WHAT WE DO DIFFERENTLY</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">Our edge<span style="color: rgb(4, 193, 226)">.</span></h2></div><div class="pillars"><div><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Real stress</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Safely triggered</p></div><div><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Your body</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Live heart data</p></div><div><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Every session</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Measured</p></div><div><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">One box</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Plug and play</p></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: var(--s-head); max-width: 760px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">What we stand for</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">Our Values<span style="color: rgb(4, 193, 226)">.</span></h2><p style="font-size: 20px; color: #C9D6E2; max-width: 700px; text-wrap: pretty">We believe in holding a standard of excellence - in care, design, and technology, so that we can deliver training that builds confidence and personal ownership.</p></div><div class="values"><div><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.9; color: #04C1E2">01</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Evidence-based</p><p style="font-size: 16px; line-height: 1.6; color: #A9BCCD">Our method comes from published work on stress-inducing VR, live biometrics, heart-rate variability and game-based biofeedback.</p></div><div><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.9; color: #04C1E2">02</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Excellence</p><p style="font-size: 16px; line-height: 1.6; color: #A9BCCD">We believe in holding a standard of excellence in Design, Technology and Service.</p></div><div><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.9; color: #04C1E2">03</p><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 3vw, 40px); line-height: 0.95">Empowerment</p><p style="font-size: 16px; line-height: 1.6; color: #A9BCCD">Every design decision helps build confidence and personal ownership over your training.</p></div></div>
</div>

<section class="tx" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px; overflow: hidden"><img src="assets/img/graph-2.png" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(18px) saturate(.6); opacity: .22; z-index: -2; transform: scale(1.1)"><div style="position: absolute; inset: 0; z-index: -1; background: linear-gradient(to right, rgba(3,17,30,.97) 30%, rgba(3,17,30,.75))"></div><div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: var(--s-intro) var(--s-col); align-items: center"><div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">Built on research</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">15+ years of science<span style="color: rgb(4, 193, 226)">.</span></h2><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">BRAVR applies principles from more than fifteen years of academic research into stress-inducing VR, real-time biometrics, heart-rate variability and game-driven biofeedback.</p><p style="font-size: 17px; line-height: 1.6; color: #C9D6E2">Every workout is designed to trigger a real stress response safely, measure it live, and teach your body to take back control faster each time.</p><div><a href="research.html" style="background: #04C1E2; color: #03111E; border: 1px solid #04C1E2; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">See the research</a></div></div><div style="flex: 1 1 280px; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px"><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">15+</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">years of research behind the method</p></div><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">14</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">peer-reviewed studies we build on</p></div><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">€130k</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">pre-seed raised, August 2025</p></div><div style="border-top: 2px solid #04C1E2; padding-top: 14px"><p style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 52px; line-height: 1">2026</p><p style="font-size: 14px; line-height: 1.6; color: #A9BCCD">first police pilot, UK</p></div></div></div></section>
<section class="tx tx-pop" style="border-top: 1px solid #17304A; padding: var(--s-section) 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-intro)">
<div style="display: flex; flex-direction: column; gap: var(--s-head); max-width: 760px"><p class="rise" style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #04C1E2">WHO WE ARE</p><h2 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 5.4vw, 68px); line-height: 0.95; text-wrap: balance">OUR team<span style="color: rgb(4, 193, 226)">.</span></h2><p class="" style="font-size: 20px; color: #C9D6E2; max-width: 700px; text-wrap: pretty">Engineers, designers, researchers and one very good dog.</p></div><div style="display: flex; flex-direction: column; gap: 16px"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Founders</p><div class="founders"><div><img class="fp" src="assets/img/team/thijs-doornbos.jpg" alt="Thijs Doornbos"><div style="display: flex; flex-direction: column; gap: 4px"><h3 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(34px, 3.2vw, 44px); line-height: 0.95">Thijs Doornbos</h3><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Co-founder · Engineering</p></div><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">Hi, I'm Thijs. A Dad. A Dev. A Dreamer.<br>I am a full-stack engineer turned award-winning game and VR developer in commercial and academic markets. I specialise in bioinformatics.</p><a href="https://www.linkedin.com/in/thijs-doornbos-050a0a93" target="_blank" rel="noopener" style="font-size: 15px; margin-top: auto">LinkedIn ↗</a></div><div><img class="fp" src="assets/img/team/ken-koontz.jpg" alt="Ken Koontz"><div style="display: flex; flex-direction: column; gap: 4px"><h3 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(34px, 3.2vw, 44px); line-height: 0.95">Ken Koontz</h3><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Co-founder · Creative</p></div><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">I'm a curious designer and a dad of two little rug rats that are my joy. I am also an award-winning creator of applied behavioural-science games in research and mental healthcare for over 15 years.</p><a href="https://www.linkedin.com/in/kenkoontz/" target="_blank" rel="noopener" style="font-size: 15px; margin-top: auto">LinkedIn ↗</a></div><div><img class="fp" src="assets/img/team/peter-barker.jpg" alt="Peter Barker"><div style="display: flex; flex-direction: column; gap: 4px"><h3 style="font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(34px, 3.2vw, 44px); line-height: 0.95">Peter Barker</h3><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Co-founder · Operations</p></div><p style="font-size: 16px; line-height: 1.6; color: #C9D6E2">Between flag football, a pair of kids, and a career from startup to scale-up to IPO,<br>I live to help high-performing teams scale quickly, solve problems, and occasionally score a TD or two.</p><a href="https://www.linkedin.com/in/peterdavidbarker/" target="_blank" rel="noopener" style="font-size: 15px; margin-top: auto">LinkedIn ↗</a></div></div></div><div style="display: flex; flex-direction: column; gap: 16px"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">The team</p><div class="team-row"><div><img src="assets/img/team/lena.jpg" alt=""><div style="display: flex; flex-direction: column; gap: 2px"><p style="font-weight: 600; font-size: 20px">Lena Čechovičová</p><p style="font-size: 15px; line-height: 1.6; color: #A9BCCD">Research</p><p style="font-size: 15px; line-height: 1.55; color: #C9D6E2; margin-top: 6px">A Master’s student in Brain and Cognition who is obsessed with psychology and occultism. Loves bad puns, mysteries and big questions, and can’t stand wet socks.</p></div></div><div><img src="assets/img/team/devon.jpg" alt=""><div style="display: flex; flex-direction: column; gap: 2px"><p style="font-weight: 600; font-size: 20px">Devon Yagian</p><p style="font-size: 15px; line-height: 1.6; color: #A9BCCD">Audio</p><p style="font-size: 15px; line-height: 1.55; color: #C9D6E2; margin-top: 6px">A sonic artist and an anthropologist who grew up on a diet of punk and spooky FX tapes. Most importantly, the father of a super curious and totally wild boy.</p></div></div><div><img src="assets/img/team/george.jpg" alt=""><div style="display: flex; flex-direction: column; gap: 2px"><p style="font-weight: 600; font-size: 20px">George</p><p style="font-size: 15px; line-height: 1.6; color: #A9BCCD">Joy</p><p style="font-size: 15px; line-height: 1.55; color: #C9D6E2; margin-top: 6px">Friend. Wanderer. Wizard. Traveller.<br>I am many different things to many different people, but above all else I strive <s>for attention</s> to live every day I have as the goodest boi.</p></div></div></div></div><div style="display: flex; flex-direction: column; gap: 20px"><p style="font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9BCCD">Advisors</p><div class="adv-cards"><figure><img src="assets/img/team/cornell-wilson.jpg" alt="Portrait of Cornell A. Wilson Jr."><p style="font-weight: 600; font-size: 18px; line-height: 1.3">Cornell A. Wilson Jr.</p><p style="font-size: 14px; line-height: 1.55; color: #A9BCCD">Major General, USMC (Retired)</p></figure><figure><img src="assets/img/team/scott-williamson.jpg" alt="Portrait of Scott Williamson"><p style="font-weight: 600; font-size: 18px; line-height: 1.3">Scott Williamson</p><p style="font-size: 14px; line-height: 1.55; color: #A9BCCD">PSLM, MSyl · former National Chief Firearms Instructor and police leadership trainer</p></figure><figure><img src="assets/img/team/kelli-dunlap.jpg" alt="Portrait of Kelli Dunlap"><p style="font-weight: 600; font-size: 18px; line-height: 1.3">Kelli Dunlap</p><p style="font-size: 14px; line-height: 1.55; color: #A9BCCD">PsyD · clinical psychologist and game designer</p></figure><figure><img src="assets/img/team/egi-cuijten-niks.jpg" alt="Portrait of Egi Cuijten-Niks"><p style="font-weight: 600; font-size: 18px; line-height: 1.3">Egi Cuijten-Niks</p><p style="font-size: 14px; line-height: 1.55; color: #A9BCCD">Founder and CEO of Flashgroup XR and Apollo Journey</p></figure></div></div><div style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center"><a href="contact.html" style="background: #04C1E2; color: #03111E; border: 1px solid #04C1E2; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Work with us</a><p style="font-size: 16px; color: #A9BCCD">We’re growing. If you want to help people perform under pressure, get in touch.</p></div>
