 16px; line-height: 1.6; color: #A9BCCD">The rest of the pilot price is due by your first session at [PARTNER GYM], [ADDRESS], Amsterdam.</p></div></div><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center"><a href="index.html" style="background: #04C1E2; color: #03111E; border: 1px solid #04C1E2; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Back to the pilot page</a><a href="contact.html" style="background: transparent; color: #F6FBFF; border: 1px solid #23415E; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Questions? Get in touch</a></div>
